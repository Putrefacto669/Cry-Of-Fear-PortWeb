// cof_web.cfg - Controles del Cry of Fear original para el port web.
// loader.js lo ejecuta en cada arranque (+exec), después de config.cfg del usuario.
// package.sh lo copia al paquete de arranque (/rodir/cryoffear).

bind "TAB" "+inventory"     // bolso (platform/web/hud.js)
bind "b" "+objectives"
// las armas de CoF van en el servidor (game/cof-logic/cof/weapons_cof.cpp): sin predicción
cl_lw 0
// Cry of Fear no tiene punto de mira
crosshair 0
// las líneas de consola no se pintan sobre el juego (siguen en el registro, ?debug=1)
con_notifytime 0

bind "SHIFT" "+sprint"      // correr: gasta energía (game/cof-logic/cof/player_cof.cpp)
bind "CTRL" "+duck"
// Ctrl+W, Ctrl+T o Ctrl+N los atrapa el navegador fuera de la pantalla completa: C también agacha
bind "c" "+duck"
bind "SPACE" "+jump"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "e" "+use"
bind "f" "flashlight"
bind "r" "+reload"
bind "ALT" "+dodge"
bind "1" "quicksel 1"
bind "2" "quicksel 2"
bind "3" "quicksel 3"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "`" "toggleconsole"
bind "~" "toggleconsole"
