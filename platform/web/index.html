<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cry of Fear Web</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0b0c; --fg: #c9c9c9; --dim: #6b6b6b; --err: #e06c6c; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
                 font: 13px/1.4 ui-monospace, Consolas, monospace; }
    body { display: grid; grid-template-rows: auto 1fr 28vh; }
    header { padding: 6px 12px; color: var(--dim); border-bottom: 1px solid #222; }
    #pointer { float: right; color: var(--fg); }
    #canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
    #log { overflow-y: auto; padding: 6px 12px; border-top: 1px solid #222; white-space: pre-wrap; }
    #log .err { color: var(--err); }
  </style>
</head>
<body>
  <header>Cry of Fear · Xash3D FWGS / WebAssembly — <span id="status">Iniciando…</span> <span id="pointer"></span></header>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="log"></div>
  <script src="gpustats.js"></script>
  <script src="postfx.js"></script>
  <script src="loader.js"></script>
</body>
</html>
